# Included in every location, because an add_header in a location replaces all of the server's.
#
# The policy limits what may frame the page and what the page may embed, submit or use as its base URL. It leaves
# scripts, styles, images, workers and connections alone, so the WebGL scene, the inline data: favicon in index.html,
# the blob: URLs three.js makes for textures inside the GLBs, the save export download and same-origin model fetches
# all keep working. Fullscreen keeps its default (this origin only), because the game has a fullscreen button.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Content-Security-Policy "frame-ancestors 'self'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
