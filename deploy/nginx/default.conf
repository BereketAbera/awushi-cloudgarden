# devops.bereket.dev, behind Traefik. Traefik terminates TLS; this server only answers the cluster on 8080.
#
# The game keeps its state in the page and has no URL routes, so nothing falls back to index.html: a path with no file
# is a real 404. The static host contract in docs/DEPLOYMENT.md requires that, so a missing model or bundle reaches the
# game's retry state as an error instead of as HTML with status 200. Directories are not listed and are 404 too.

# The Cache-Control of a hashed bundle, by status. A bundle that is there may be cached for a year, whether it is sent
# whole, as a range or as a 304. Every other answer, above all the 404 for a bundle this release does not have, is
# no-cache. During a rollout an old pod answers 404 for the new release's bundles, and any shared cache may keep a 404
# that has no Cache-Control (RFC 9111, section 4.2.2), as a CDN in front of Traefik would. Its visitors would then see
# the retry state after the rollout is over. This file is included in nginx.conf's http block, where a map belongs.
map $status $bundle_cache_control {
    200     "public, max-age=31536000, immutable";
    206     "public, max-age=31536000, immutable";
    304     "public, max-age=31536000, immutable";
    default "no-cache";
}

server {
    listen 8080;
    server_name _;
    # dist/, which the Dockerfile copies here, and nothing else. /usr/share/nginx/html keeps the base image's own pages.
    root /srv/www;

    server_tokens off;
    absolute_redirect off;
    port_in_redirect off;

    # A types block here replaces the map nginx.conf includes, so the stock one comes back first. It has no GLB entry.
    include /etc/nginx/mime.types;
    types {
        model/gltf-binary glb;
    }
    charset utf-8;
    charset_types text/css text/plain application/javascript application/json image/svg+xml;

    # The image build writes a .gz beside every .js, .css, .html, .svg, .json and .glb, and gzip_static sends it to a
    # client that accepts gzip, so no model is compressed per request. gzip covers the same types if a .gz is missing.
    # gzip_proxied any, because both read it: by default a request with a Via header, which some proxies on the way to
    # Traefik add, would get the uncompressed models. gzip_vary keeps caches from mixing the two encodings.
    gzip_static on;
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml model/gltf-binary;

    # Probes from the kubelet: no log line every few seconds. Traefik logs the public requests.
    location = /healthz {
        access_log off;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    # Vite's bundles carry a content hash in their names, such as /assets/index-bmle6U-W.js, /assets/Scene-BXhJUw21.js
    # and /assets/index-C6f-ENBC.css, so a cached copy can never be stale. "always", so that a 404 gets the no-cache
    # that $bundle_cache_control, above, gives it, instead of no Cache-Control at all.
    location ~ "^/assets/[^/]+-[A-Za-z0-9_-]{8,}\.(?:js|css)$" {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control $bundle_cache_control always;
        try_files $uri =404;
    }

    # The models keep their stable names from public/assets, so a browser revalidates each one, and a release that
    # changes a model is seen on the next load instead of after a cache expires.
    location ~ "\.glb$" {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri =404;
    }

    # index.html, /assets/branding/* and anything else with a stable name revalidates.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
}
