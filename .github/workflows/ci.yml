# Every pull request and every push to main runs the checks that need no GPU: lint, types, unit, pipeline and runtime
# tests, GLB validation and the production build, the same npm scripts as locally. No secrets, a read-only token, and no
# credentials left in the checkout. The Playwright suite has a job of its own, which runs only when started by hand; the
# comment on that job says why.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      browser-project:
        description: Playwright project for the browser job. "all" runs the four of them.
        type: choice
        options: [desktop, mobile, firefox, webkit, all]
        default: desktop

permissions: {}

# A newer push to a pull request replaces the older run. On main each pushed commit keeps its own run, because a
# cancelled run says nothing about its commit.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Lint, types, tests, assets, build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # engines.node in package.json is 24.x, which the Dockerfile's node image also follows.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:pipeline
      - run: npm run test:runtime
      - run: npm run assets:validate
      - run: npm run build

  # tests/browser drives the real WebGL scene in installed Google Chrome (desktop and phone emulation), Firefox and
  # WebKit, about 160 cases in all. It has only ever run on an Apple-silicon Mac with a GPU. A hosted Ubuntu runner has
  # none, so Chrome would draw every frame with SwiftShader (Playwright passes --enable-unsafe-swiftshader), and the
  # suite's frame-rate, camera-settling and timing checks have never been seen to pass that way. It is therefore not run
  # on pull requests or main, where a check nobody has seen green would only teach people to ignore red. Start it from
  # the Actions tab with "Run workflow" to try it on a runner. Nothing here is continue-on-error: a failing test fails
  # the job, and the traces of failures are kept as an artifact.
  browser:
    name: Browser (Playwright, started by hand)
    if: github.event_name == 'workflow_dispatch'
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      # The desktop and mobile projects use the installed Chrome channel, the other two Playwright's own browsers.
      - name: Install Chrome, Firefox and WebKit with their system packages
        run: npx playwright install --with-deps chrome firefox webkit
      # playwright.config.ts serves dist/ with vite preview on port 5176.
      - run: npm run build
      - name: Run the Playwright suite
        env:
          PROJECT: ${{ inputs.browser-project }}
        run: |
          if [[ "$PROJECT" == all ]]; then
            npm run test:browser
          else
            npm run test:browser -- --project="$PROJECT"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: browser-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
